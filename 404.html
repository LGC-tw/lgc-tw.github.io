<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 找不到頁面</title>
    <style>
        :root {
            --bg-color: #f7f7f7;
            --text-color: #111111;
            --muted-color: #666666;
            --border-color: #111111;
            --btn-hover-bg: #111111;
            --btn-hover-text: #f7f7f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .error-code {
            font-size: 9rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .error-desc {
            font-size: 1rem;
            color: var(--muted-color);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <div class="error-message">你似乎走進了一片未知的荒野。</div>
        <div class="error-desc">
            此頁面不存在或已被遷移。<br>請透過下方按鈕返回。
        </div>
        <div class="actions">
            <a href="/" class="btn">返回首頁</a>
            <button class="btn" onclick="history.back()">上一頁</button>
        </div>
    </div>

</body>
</html>
